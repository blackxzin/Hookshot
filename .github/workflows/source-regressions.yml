name: Game-free source regressions

on:
  push:
    branches: [main]
    paths:
      - tests/**
      - nx2/**
      - host/**
      - gpu/vk/**
      - .github/workflows/source-regressions.yml
  pull_request:
    branches: [main]
    paths:
      - tests/**
      - nx2/**
      - host/**
      - gpu/vk/**
      - .github/workflows/source-regressions.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python source checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check extraction boundaries
        run: python -I -B nx2/test_nup_paths.py
      - name: Check source-cache coherency
        run: python -I -B tests/test_make_game_cache.py
      - name: Check a failed step's error line
        run: python -I -B tests/test_failure_reason.py
      - name: C++ compiler for the import-hold check
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: Check failed-import backoff
        if: runner.os == 'Linux'
        run: python -I -B tests/test_import_hold.py
      - name: Check the FPS counter's first sample
        if: runner.os == 'Linux'
        run: python -I -B tests/test_fps_rate.py
      - name: Check FPS overlay transfer ordering
        if: runner.os == 'Linux'
        run: python -I -B tests/test_fps_overlay_order.py
      - name: Check dispatch timing stays off
        run: python -I -B tests/test_dispatch_clock.py
      - name: Check frame generation stays off until asked
        if: runner.os == 'Linux'
        run: python -I -B tests/test_framegen_gate.py
      - name: Check the table-entry tracker stops looking
        if: runner.os == 'Linux'
        run: python -I -B tests/test_table_track.py
      - name: Check descriptor timing stays off
        run: python -I -B tests/test_desc_clock.py
      - name: Check the replay clock skips the performance counter
        if: runner.os == 'Linux'
        run: python -I -B tests/test_prof_clock.py
      - name: Check a pool span is reused without the lock
        if: runner.os == 'Linux'
        run: python -I -B tests/test_pool_span.py
      - name: Check a captured page is read once
        if: runner.os == 'Linux'
        run: python -I -B tests/test_submitted_page.py
      - name: Check the shader list's text encoding
        run: python -I -B tests/test_shader_census_cmd.py
      - name: Check the build's version stamp
        run: python -I -B nx2/test_version.py
      - name: Check the audio mixer's catch-up
        if: runner.os == 'Linux'
        run: python -I -B tests/test_audio_deadline.py
      - name: Check controller rumble keeps going
        if: runner.os == 'Linux'
        run: python -I -B tests/test_rumble_refresh.py
      - name: Check upscale menu labels
        if: runner.os == 'Linux'
        run: python -I -B tests/test_upscale_label.py
      - name: Check import windows
        if: runner.os == 'Linux'
        run: python -I -B nx2/test_import_windows.py --cxx g++
      - name: Check the Linux builder shows an error line whole
        if: runner.os == 'Linux'
        run: python -I -B tests/test_builder_status.py
      - name: Check a game folder with % in its name makes a valid menu entry
        if: runner.os == 'Linux'
        run: python -I -B tests/test_desktop_exec.py
      - name: Check Linux audio loads the SDL beside the executable
        if: runner.os == 'Linux'
        run: python -I -B tests/test_sdl_audio_library.py
      - name: Check SSBO diagnostics never read an unbound address
        if: runner.os == 'Linux'
        run: python -I -B nx2/test_dump_ssbo_read.py --cxx g++
      - name: Check mesh and vertex dynamic state caching
        if: runner.os == 'Linux'
        run: python -I -B nx2/test_mesh_dynamic_state.py --cxx g++
